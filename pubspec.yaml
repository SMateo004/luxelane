name: luxelane
description: Premium ride-hailing app — Luxelane
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.2 # Google sign-in on Android/iOS (web uses Firebase popup)
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_crashlytics: ^4.0.4
  firebase_performance: ^0.10.0
  cloud_functions: ^5.0.4

  # Payments
  flutter_stripe: ^10.2.0

  # Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  geolocator: ^13.0.1
  map_launcher: ^3.1.0
  url_launcher: ^6.3.0

  # HTTP
  http: ^1.2.2

  # Video
  video_player: ^2.9.2

  # Utilities
  dartz: ^0.10.1
  rxdart: ^0.27.7
  intl: ^0.19.0
  uuid: ^4.4.2
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0

  # Storage
  shared_preferences: ^2.3.2
  google_fonts: ^6.3.2
  firebase_storage: ^12.4.10
  file_picker: ^11.0.3
  firebase_app_check: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen/app_localizations*.dart from lib/l10n/app_*.arb
  generate: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/booking/
    - assets/images/brand/
    - assets/images/home/
    - assets/images/vehicles/
    - assets/images/vehicles/business_class/
    - assets/images/vehicles/first_class/
    - assets/images/vehicles/van/
    - assets/images/vehicles/electric/
    - assets/images/vehicles/business_suv/
    - assets/images/booking/luggage/
    - assets/images/booking/seating/
    - assets/images/services/recogida/
    - assets/images/services/aeropuerto/
    - assets/images/services/por-horas/
    - assets/icons/
    - assets/videos/
    - assets/google_fonts/OFL-Montserrat.txt
    - assets/google_fonts/OFL-CormorantGaramond.txt
  # Brand fonts ship with the app: no download at startup (works offline),
  # and both TextStyle(fontFamily: 'Montserrat') and google_fonts (which
  # looks for these files by name in the assets) use them.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/google_fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Cormorant Garamond
      fonts:
        - asset: assets/google_fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/google_fonts/CormorantGaramond-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/google_fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/CormorantGaramond-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/google_fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
