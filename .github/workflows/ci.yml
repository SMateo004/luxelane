name: Luxelane CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Las reglas se despliegan aparte y a mano, al final (DEPLOY.md, «Orden
  # de despliegue»): functions → apps publicadas → versiones mínimas → reglas.
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: 'Desplegar firestore.rules a producción (último paso)'
        type: boolean
        default: false

# Acciones de terceros fijadas por SHA (la etiqueta va en el comentario).

env:
  # Must satisfy pubspec.lock (google_fonts >=6.3.1 needs Dart >=3.7).
  FLUTTER_VERSION: '3.29.3'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:

  # ---------------------------------------------------------------------------
  lint:
  # ---------------------------------------------------------------------------
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Errors and warnings fail the build; style infos are reported only.
      - run: flutter analyze --no-fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib/ test/

  # ---------------------------------------------------------------------------
  test:
  # ---------------------------------------------------------------------------
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Flutter unit & widget tests
        run: flutter test --coverage --reporter=github

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Functions tests
        working-directory: functions
        run: |
          npm ci
          npm test

  # ---------------------------------------------------------------------------
  rules_tests:
  # ---------------------------------------------------------------------------
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Proyecto ficticio demo-luxelane: no usa credenciales ni toca
      # ningún proyecto real.
      - name: Rules tests (emulator)
        working-directory: tools/rules-tests
        run: |
          npm ci
          npm run test:rules
      # Handlers reales de onBookingCreated y closeOpenRequest contra el
      # emulador de Firestore.
      - name: Trigger integration tests (emulator)
        run: |
          npm --prefix functions ci
          npm --prefix tools/rules-tests run test:integration
      # Plantilla, validación y calibración de tarifas (sin valores reales).
      - name: Pricing tools tests
        run: |
          npm --prefix tools/pricing ci
          npm --prefix tools/pricing test

  # ---------------------------------------------------------------------------
  build_web_rider:
  # ---------------------------------------------------------------------------
    name: Build Web (Rider)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build rider web
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          # App Check en la web (reCAPTCHA v3): sin clave la release no sale.
          if [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::error::Release web build without App Check: missing repository secret RECAPTCHA_SITE_KEY (see DEPLOY.md, App Check)."
            exit 1
          fi
          flutter build web --release \
            --dart-define=ENV=prod \
            --dart-define=FIREBASE_ENV=production \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_WEB_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY" \
            --pwa-strategy=none \
            --output=build/web_rider
          # Flutter writes an empty worker with --pwa-strategy=none; ours also
          # retires the old caching worker on returning visitors.
          cp web/flutter_service_worker.js build/web_rider/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-rider
          path: build/web_rider

  # ---------------------------------------------------------------------------
  build_web_driver:
  # ---------------------------------------------------------------------------
    name: Build Web (Driver)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build driver web
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          # App Check en la web (reCAPTCHA v3): sin clave la release no sale.
          if [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::error::Release web build without App Check: missing repository secret RECAPTCHA_SITE_KEY (see DEPLOY.md, App Check)."
            exit 1
          fi
          flutter build web --release \
            -t lib/main_driver.dart \
            --dart-define=ENV=prod \
            --dart-define=FIREBASE_ENV=production \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_WEB_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY" \
            --pwa-strategy=none \
            --output=build/web_driver
          # Flutter writes an empty worker with --pwa-strategy=none; ours also
          # retires the old caching worker on returning visitors.
          cp web/flutter_service_worker.js build/web_driver/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-driver
          path: build/web_driver

  # ---------------------------------------------------------------------------
  build_android:
  # ---------------------------------------------------------------------------
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Upload keystore (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Build rider AAB
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=ENV=prod \
            --dart-define=FIREBASE_ENV=production \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --obfuscate \
            --split-debug-info=build/debug-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-rider-release
          path: build/app/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  build_android_driver:
  # ---------------------------------------------------------------------------
    name: Build Android (Driver)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Upload keystore (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Build driver AAB
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          flutter build appbundle --release \
            -t lib/main_driver.dart \
            --dart-define=ENV=prod \
            --dart-define=FIREBASE_ENV=production \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --obfuscate \
            --split-debug-info=build/debug-info-driver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-driver-release
          path: build/app/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  build_ios:
  # ---------------------------------------------------------------------------
    name: Build iOS (Rider)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: iOS Maps key (from secrets)
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
        run: echo "GOOGLE_MAPS_API_KEY = $GOOGLE_MAPS_IOS_API_KEY" > ios/Flutter/Secrets.xcconfig
      - name: Build iOS rider (no-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENV=prod \
            --dart-define=FIREBASE_ENV=production \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }} \
            --dart-define=FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}

  # ---------------------------------------------------------------------------
  deploy_functions:
  # ---------------------------------------------------------------------------
    name: Deploy Functions
    runs-on: ubuntu-latest
    needs: [rules_tests, build_web_rider, build_android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Requiere la aprobación de los revisores del entorno `production`.
    environment: production
    # Un solo despliegue a la vez; uno en curso nunca se cancela.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Fail fast with a clear message instead of deploying a half-configured
      # app (e.g. a web build without a Maps key has no address autocomplete).
      - name: Check deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
        run: |
          missing=0
          for name in GCP_SA_KEY GOOGLE_MAPS_WEB_API_KEY FCM_VAPID_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build & deploy functions
        working-directory: functions
        run: npm ci && npm run build
      # Las funciones de pago leen STRIPE_SECRET_KEY de Secret Manager: sin
      # ese secreto en el proyecto, el despliegue no sigue. Solo lee los
      # metadatos de las versiones, nunca el valor.
      - name: Check Secret Manager secrets
        uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: functions:secrets:get STRIPE_SECRET_KEY
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc
      # Código de recogida (D1): sin el secreto no hay códigos y nadie
      # verifica; mejor no desplegar.
      - name: Check PICKUP_CODE_SECRET
        uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: functions:secrets:get PICKUP_CODE_SECRET
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc
      # Distancia por calles de quoteBooking y createBooking (D2).
      - name: Check MAPS_SERVER_KEY
        uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: functions:secrets:get MAPS_SERVER_KEY
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc
      # Sal del límite por IP del formulario de empresas: sin ella la callable
      # rechaza todo envío.
      - name: Check RATE_LIMIT_SALT
        uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: functions:secrets:get RATE_LIMIT_SALT
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc
      # Functions e índices (los índices no cambian permisos y las consultas
      # nuevas los necesitan); las reglas van al final, con su job manual.
      # Sin --force a propósito: si se retira una función del código, el
      # despliegue no interactivo se detiene en vez de borrarla; se borra a
      # mano antes (DEPLOY.md, «Funciones retiradas»).
      - uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: deploy --only functions,firestore:indexes
        env:
          # Service-account JSON (or base64 of it); replaces deprecated CI tokens.
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc

  # ---------------------------------------------------------------------------
  deploy_rules:
  # ---------------------------------------------------------------------------
    # Último paso de cada despliegue que cambia reglas: se lanza a mano
    # (Actions → Run workflow → deploy_rules) cuando las apps nuevas están
    # publicadas, las versiones mínimas puestas y no quedan viajes con la app
    # antigua (DEPLOY.md).
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    needs: [rules_tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_rules
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Missing environment secret: GCP_SA_KEY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc

  # ---------------------------------------------------------------------------
  deploy_hosting:
  # ---------------------------------------------------------------------------
    name: Deploy Hosting
    runs-on: ubuntu-latest
    needs: [rules_tests, deploy_functions, build_web_rider, build_web_driver]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reuse the web builds from this run (already built with the prod
      # secrets) and place them where firebase.json's hosting targets expect:
      # rider -> hosting/public, driver -> hosting/driver.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-rider
          path: hosting/public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-driver
          path: hosting/driver

      - uses: w9jds/firebase-action@35d0fd9b92b2c66dcd13f1b72dacc588e89e7567 # v15.32.1
        with:
          args: deploy --only hosting
        env:
          # Service-account JSON (or base64 of it); replaces deprecated CI tokens.
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # alias `production` de .firebaserc
