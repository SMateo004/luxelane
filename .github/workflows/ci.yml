name: Luxelane CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.29.3'  # pubspec.lock requires >=3.29
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:

  # ---------------------------------------------------------------------------
  lint:
  # ---------------------------------------------------------------------------
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Translations are complete and generated
        run: |
          dart run tool/build_l10n.dart --check
          flutter gen-l10n
          git diff --exit-code lib/l10n/gen
      - run: flutter analyze --no-fatal-infos
      - name: Android and iOS config files parse
        run: python3 tool/check_native_config.py
      # TODO: enforce `dart format --set-exit-if-changed lib/ test/` once the
      # codebase has been formatted in a dedicated commit.

  # ---------------------------------------------------------------------------
  test:
  # ---------------------------------------------------------------------------
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Flutter unit & widget tests
        run: flutter test --coverage --reporter=github

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

      - name: Functions tests
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

  # ---------------------------------------------------------------------------
  rules_test:
  # ---------------------------------------------------------------------------
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run rules tests against the emulator
        working-directory: rules-tests
        run: |
          npm ci
          npm test

  # ---------------------------------------------------------------------------
  build_web_rider:
  # ---------------------------------------------------------------------------
    name: Build Web (Rider)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build rider web
        run: |
          flutter build web --release \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=APP_CHECK_WEB_KEY=${{ secrets.APP_CHECK_WEB_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --output=build/web_rider
      - uses: actions/upload-artifact@v4
        with:
          name: web-rider
          path: build/web_rider

  # ---------------------------------------------------------------------------
  build_web_driver:
  # ---------------------------------------------------------------------------
    name: Build Web (Driver)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build driver web
        run: |
          flutter build web --release \
            -t lib/main_driver.dart \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=APP_CHECK_WEB_KEY=${{ secrets.APP_CHECK_WEB_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --output=build/web_driver
      - uses: actions/upload-artifact@v4
        with:
          name: web-driver
          path: build/web_driver

  # ---------------------------------------------------------------------------
  build_android:
  # ---------------------------------------------------------------------------
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Firebase config of the Android app (scripts/setup_mobile.sh writes
      # it; store the file's content in this secret). Without it the app
      # can't start, so the job fails instead of shipping a broken bundle.
      - name: Firebase config
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_RIDER_ANDROID_ENV }}
        run: |
          [ -n "$FIREBASE_ENV" ] || { echo "::error::Set the FIREBASE_RIDER_ANDROID_ENV secret (scripts/setup_mobile.sh)"; exit 1; }
          printf '%s\n' "$FIREBASE_ENV" > firebase.android.env
      - name: Build rider AAB
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          flutter build appbundle --release --flavor rider -t lib/main.dart \
            --dart-define-from-file=firebase.android.env \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --dart-define=LUX_BUILD="$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)" \
            --obfuscate \
            --split-debug-info=build/debug-info
      - uses: actions/upload-artifact@v4
        with:
          name: android-rider-release
          path: build/app/outputs/bundle/riderRelease/app-rider-release.aab

  # ---------------------------------------------------------------------------
  build_android_driver:
  # ---------------------------------------------------------------------------
    name: Build Android (Driver)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Firebase config
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_DRIVER_ANDROID_ENV }}
        run: |
          [ -n "$FIREBASE_ENV" ] || { echo "::error::Set the FIREBASE_DRIVER_ANDROID_ENV secret (scripts/setup_mobile.sh)"; exit 1; }
          printf '%s\n' "$FIREBASE_ENV" > firebase.android.env
      - name: Build driver AAB
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          flutter build appbundle --release --flavor driver \
            -t lib/main_driver.dart \
            --dart-define-from-file=firebase.android.env \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --dart-define=LUX_BUILD="$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)" \
            --obfuscate \
            --split-debug-info=build/debug-info-driver
      - uses: actions/upload-artifact@v4
        with:
          name: android-driver-release
          path: build/app/outputs/bundle/driverRelease/app-driver-release.aab

  # ---------------------------------------------------------------------------
  deploy_functions:
  # ---------------------------------------------------------------------------
    name: Deploy Functions
    runs-on: ubuntu-latest
    needs: [build_web_rider, rules_test]  # Android builds are independent of the backend
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build & deploy functions
        working-directory: functions
        run: npm ci && npm run build
      - uses: w9jds/firebase-action@master
        with:
          # Storage rules guard the chauffeur documents uploads.
          args: deploy --only functions,firestore,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: luxelane-4e7ae  # matches .firebaserc

  # ---------------------------------------------------------------------------
  deploy_hosting:
  # ---------------------------------------------------------------------------
    name: Deploy Hosting
    runs-on: ubuntu-latest
    needs: [deploy_functions, build_web_rider, build_web_driver]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Both sites (rider + driver targets in firebase.json) deploy together,
      # from the builds of this same commit.
      - uses: actions/download-artifact@v4
        with:
          name: web-rider
          path: hosting/public
      - uses: actions/download-artifact@v4
        with:
          name: web-driver
          path: hosting/driver

      - uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: luxelane-4e7ae  # matches .firebaserc
