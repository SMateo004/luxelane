name: Luxelane CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Must satisfy pubspec.lock (google_fonts >=6.3.1 needs Dart >=3.7).
  FLUTTER_VERSION: '3.29.3'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:

  # ---------------------------------------------------------------------------
  lint:
  # ---------------------------------------------------------------------------
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Translations are complete and generated
        run: |
          dart run tool/build_l10n.dart --check
          flutter gen-l10n
          git diff --exit-code lib/l10n/gen
      - run: flutter analyze --no-fatal-infos
      - name: Android and iOS config files parse
        run: python3 tool/check_native_config.py
      # TODO: enforce `dart format --set-exit-if-changed lib/ test/` once the
      # codebase has been formatted in a dedicated commit.

  # ---------------------------------------------------------------------------
  test:
  # ---------------------------------------------------------------------------
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Flutter unit & widget tests
        run: flutter test --coverage --reporter=github

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Functions tests
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

  # ---------------------------------------------------------------------------
  rules_test:
  # ---------------------------------------------------------------------------
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run rules tests against the emulator
        working-directory: rules-tests
        run: |
          npm ci
          npm test

  # ---------------------------------------------------------------------------
  build_web_rider:
  # ---------------------------------------------------------------------------
    name: Build Web (Rider)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build rider web
        run: |
          flutter build web --release \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=APP_CHECK_WEB_KEY=${{ secrets.APP_CHECK_WEB_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --pwa-strategy=none \
            --output=build/web_rider
          # Flutter writes an empty worker with --pwa-strategy=none; ours also
          # retires the old caching worker on returning visitors.
          cp web/flutter_service_worker.js build/web_rider/
      - uses: actions/upload-artifact@v4
        with:
          name: web-rider
          path: build/web_rider

  # ---------------------------------------------------------------------------
  build_web_driver:
  # ---------------------------------------------------------------------------
    name: Build Web (Driver)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build driver web
        run: |
          flutter build web --release \
            -t lib/main_driver.dart \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=APP_CHECK_WEB_KEY=${{ secrets.APP_CHECK_WEB_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --pwa-strategy=none \
            --output=build/web_driver
          # Flutter writes an empty worker with --pwa-strategy=none; ours also
          # retires the old caching worker on returning visitors.
          cp web/flutter_service_worker.js build/web_driver/
      - uses: actions/upload-artifact@v4
        with:
          name: web-driver
          path: build/web_driver

  # ---------------------------------------------------------------------------
  build_android:
  # ---------------------------------------------------------------------------
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Firebase config of each Android app (scripts/setup_mobile.sh writes
      # it; store the file's content in this secret). Kept alongside the
      # FIREBASE_ANDROID_APP_ID define until one of the two is retired.
      - name: Firebase config
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_RIDER_ANDROID_ENV }}
        run: |
          if [ -n "$FIREBASE_ENV" ]; then
            printf '%s\n' "$FIREBASE_ENV" > firebase.android.env
          else
            echo "::warning::FIREBASE_RIDER_ANDROID_ENV is not set (scripts/setup_mobile.sh); the bundle relies on FIREBASE_ANDROID_APP_ID instead"
            echo "# no Firebase env secret" > firebase.android.env
          fi
      - name: Build rider AAB
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build appbundle --release --flavor rider -t lib/main.dart \
            --dart-define-from-file=firebase.android.env \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --dart-define=LUX_BUILD="$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)" \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --obfuscate \
            --split-debug-info=build/debug-info
      - uses: actions/upload-artifact@v4
        with:
          name: android-rider-release
          path: build/app/outputs/bundle/riderRelease/app-rider-release.aab

  # ---------------------------------------------------------------------------
  build_android_driver:
  # ---------------------------------------------------------------------------
    name: Build Android (Driver)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Firebase config
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_DRIVER_ANDROID_ENV }}
        run: |
          if [ -n "$FIREBASE_ENV" ]; then
            printf '%s\n' "$FIREBASE_ENV" > firebase.android.env
          else
            echo "::warning::FIREBASE_DRIVER_ANDROID_ENV is not set (scripts/setup_mobile.sh); the bundle relies on FIREBASE_ANDROID_APP_ID instead"
            echo "# no Firebase env secret" > firebase.android.env
          fi
      - name: Build driver AAB
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build appbundle --release --flavor driver \
            -t lib/main_driver.dart \
            --dart-define-from-file=firebase.android.env \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=APP_VERSION=${{ github.sha }} \
            --dart-define=LUX_BUILD="$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)" \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} \
            --obfuscate \
            --split-debug-info=build/debug-info-driver
      - uses: actions/upload-artifact@v4
        with:
          name: android-driver-release
          path: build/app/outputs/bundle/driverRelease/app-driver-release.aab

  # ---------------------------------------------------------------------------
  build_ios:
  # ---------------------------------------------------------------------------
    name: Build iOS (Rider)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS rider (no-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENV=prod \
            --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}

  # ---------------------------------------------------------------------------
  deploy_functions:
  # ---------------------------------------------------------------------------
    name: Deploy Functions
    runs-on: ubuntu-latest
    needs: [build_web_rider, rules_test]  # Android builds are independent of the backend
    if: github.ref == 'refs/heads/main'
    steps:
      # Fail fast with a clear message instead of deploying a half-configured
      # app (e.g. a web build without a Maps key has no address autocomplete).
      - name: Check deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
        run: |
          missing=0
          for name in GCP_SA_KEY GOOGLE_MAPS_API_KEY FCM_VAPID_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build & deploy functions
        working-directory: functions
        run: npm ci && npm run build
      - uses: w9jds/firebase-action@master
        with:
          # Storage rules guard the chauffeur documents uploads.
          args: deploy --only functions,firestore,storage
        env:
          # Service-account JSON (or base64 of it); replaces deprecated CI tokens.
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # matches .firebaserc / firebase_options.dart

  # ---------------------------------------------------------------------------
  deploy_hosting:
  # ---------------------------------------------------------------------------
    name: Deploy Hosting
    runs-on: ubuntu-latest
    needs: [deploy_functions, build_web_rider, build_web_driver]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Reuse the web builds from this run (already built with the prod
      # secrets) and place them where firebase.json's hosting targets expect:
      # rider -> hosting/public, driver -> hosting/driver.
      - uses: actions/download-artifact@v4
        with:
          name: web-rider
          path: hosting/public
      - uses: actions/download-artifact@v4
        with:
          name: web-driver
          path: hosting/driver

      - uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          # Service-account JSON (or base64 of it); replaces deprecated CI tokens.
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: luxelane-4e7ae  # matches .firebaserc / firebase_options.dart
