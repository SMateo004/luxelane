# Flutter gen-l10n configuration.
# Translations are authored in lib/l10n/parts/*.json and merged into the ARB
# files with `dart run tool/build_l10n.dart` (see lib/l10n/README.md).
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/gen
synthetic-package: false
nullable-getter: false
untranslated-messages-file: build/untranslated_messages.json
