<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luxelane — Servicio de chófer ejecutivo">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Luxelane">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Luxelane — Servicio de chófer ejecutivo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google Maps JS is injected dynamically by main.dart using the
       GOOGLE_MAPS_KEY dart-define. No static key needed here. -->

  <style>
    body {
      background-color: #FAFBFE;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- A new URL per build, so browsers never reuse an old app after a deploy. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=' + {{flutter_service_worker_version}};
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
